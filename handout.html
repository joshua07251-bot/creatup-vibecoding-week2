*{box-sizing:border-box}body{margin:0;background:#e8e6e1;color:#171717;font-family:'Pretendard Variable','Noto Sans KR',sans-serif;font-size:10.5pt;line-height:1.65}h1{font-size:26pt;line-height:1.25;letter-spacing:-1px;margin:20px 0}h2{font-size:19pt;line-height:1.35;margin:12px 0}h3{font-size:11.5pt;margin:16px 0 6px}p{margin:8px 0}ul,ol{padding-left:20px;margin:6px 0}li{margin:5px 0}pre{font:inherit;font-size:9.6pt;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;word-break:keep-all;background:#f5f2ec;border:1px solid #ddd4c7;border-radius:8px;padding:12px;margin:8px 0}.sheet{width:210mm;min-height:297mm;background:white;margin:20px auto;padding:17mm 17mm 16mm;position:relative;display:flex;flex-direction:column}.top{font-weight:750;font-size:9pt;color:#766659;border-bottom:1px solid #ded7cc;padding-bottom:8px}.badge{font-size:10pt;font-weight:700;color:#905020}.box{border:1px solid #d5c8b7;background:#faf8f3;border-radius:8px;padding:12px;margin:12px 0}.note{min-height:33mm;border:1px solid #ddd;border-radius:8px;background:repeating-linear-gradient(white,white 24px,#eee 24px,#eee 25px);margin:10px 0}.footer{margin-top:auto;padding-top:12px;border-top:1px solid #ddd;font-size:8pt;display:flex;justify-content:space-between;color:#777}.screen-tools{position:sticky;top:0;background:#171717;color:white;padding:12px;text-align:center;z-index:5}.screen-tools button,.screen-tools a{font:inherit;background:white;border:0;border-radius:7px;color:#171717;padding:7px 12px;text-decoration:none;cursor:pointer;margin:0 4px}.prompt-block{break-inside:avoid;margin:10px 0}.prompt-block h3{margin-top:10px}.check{border-bottom:1px dashed #ddd;padding:7px 0}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px}.stamp{font-size:9pt;color:#777}@page{size:A4;margin:0}@media print{body{background:white}.screen-tools{display:none}.sheet{margin:0;min-height:297mm;break-after:page;page-break-after:always;box-shadow:none}.sheet:last-child{break-after:auto;page-break-after:auto}.prompt-block{break-inside:avoid}.note{print-color-adjust:exact}pre,.box{print-color-adjust:exact}}

const l=window.LESSON2,e=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),list=a=>'<ul>'+a.map(t=>'<li>'+e(t)+'</li>').join('')+'</ul>';let pages=[];const page=(title,body)=>pages.push({title,body});
page('가구를 옮기기 전에,<br>화면에서 먼저.',`<p class="badge">2강 · 가구 배치 실험실 · 120분</p><p>방·가구 치수 → 이동·회전 → 겹침·의자 뒤 여유 → A/B 비교</p><h3>오늘 수업이 끝나면</h3>${list(l.goals)}<div class="box"><b>공통 실습 치수 · cm</b><p>방 400×300 / 책상 120×60 / 의자 60×60<br>침대 100×200 / 수납장 80×30 / 뒤쪽 여유 깊이 60</p><p>왼쪽 위 X0·Y0. 의자의 기본 뒤는 아래(+Y), 시계방향 90도 후는 왼쪽(-X).</p></div><p>직사각형 방의 검토 예제입니다. 실측·3D·자동 배치·문 회전·전체 통로·안전·법규 적합성을 판단하지 않습니다. 60cm는 사용자가 바꿔보는 수업용 예시입니다.</p><h3>내가 확인하고 싶은 상황</h3><div class="note"></div>`);
l.stages.forEach((s,i)=>page(`${String(i+1).padStart(2,'0')} · ${e(s.title)}`,`<p class="badge">${s.start}~${s.end}분 · ${s.end-s.start}분</p><p>${e(s.lead)}</p><h3>이 시간에 배우는 것</h3>${list(s.learn)}<h3>직접 해보기</h3>${list(s.tasks)}<div class="box"><b>통과 기준</b><p>${e(s.checkpoint)}</p></div><h3>내 기록 · 문제와 수정 결과</h3><div class="note"></div>`));
const chunks=[l.prompts.slice(0,3),l.prompts.slice(3,6),l.prompts.slice(6,8),l.prompts.slice(8)];chunks.forEach((a,i)=>page(`AI 요청문 ${i+1} / 4`,a.map(p=>`<div class="prompt-block"><h3>${e(p.title)}</h3><pre>${e(p.text)}</pre></div>`).join('')));
page('결과를 직접 확인합니다.',`<p>실제로 시험한 항목만 체크하세요. 실행하지 않은 항목은 미확인으로 남깁니다.</p>${l.checks.map(c=>`<div class="check">□ ${e(c.text)}</div>`).join('')}<h3>다시 확인할 문제</h3><div class="note"></div>`);
page('내 상황에 맞게 한 가지만.',`<h3>선택 과제</h3>${list(l.homework.choices)}<h3>제출할 것</h3>${list(l.homework.deliverables)}<h3>설명 세 문장</h3>${list(l.homework.questions)}<div class="note" style="min-height:60mm"></div><div class="box">주소·개인정보는 넣지 않습니다. 브라우저 저장은 다른 기기로 자동 공유되지 않고 브라우저 데이터를 지우면 사라질 수 있습니다. 실제 사용의 안전이나 최적 배치를 보증하지 않습니다.</div><p><b>치수로 설명하고, 움직여 확인하고, 조건에 맞게 고칩니다.</b></p>`);
document.getElementById('sheets').innerHTML=pages.map((p,i)=>`<article class="sheet ${i>=1&&i<=9?'stage':''}"><div class="top">CREATUP · 크리터스 3기 · 바이브코딩 2강 · 수강생용</div><h1>${p.title}</h1>${p.body}<div class="footer"><span>가구 배치 실험실 · cm 기준</span><span>${i+1} / ${pages.length}</span></div></article>`).join('');window.handoutReady=true;if(new URLSearchParams(location.search).has('print'))document.fonts.ready.then(()=>setTimeout(()=>window.print(),300));
</script></body></html>
